version: "3.8"
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai_champions_app:latest
    container_name: ai_champions_app
    volumes:
      - ./:/var/www/html
    working_dir: /var/www/html
    networks:
      - app-network

  web:
    image: nginx:alpine
    container_name: ai_champions_web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app-network

  composer:
    image: composer:2
    container_name: ai_champions_composer
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    entrypoint: ["composer"]

networks:
  app-network:
    driver: bridge
